<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookbook Generator — Brand Vestimentar</title>
    <style>
        :root {
            --bg-color: #faf9f6;
            --text-color: #1a1a1a;
            --card-bg: #ffffff;
            --accent: #8c6d53;
        }
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .toolbar {
            background: #ffffff;
            padding: 20px;
            border: 1px solid #e0dcd3;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        .toolbar h3 { margin: 0 15px 0 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .toolbar input, .toolbar select, .toolbar button {
            padding: 10px 14px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .toolbar button {
            background: #1a1a1a;
            color: #fff;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .toolbar button:hover { background: var(--accent); }

        .catalog-header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #dcdcdc;
            margin-bottom: 30px;
        }
        .catalog-header .brand-name {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
        }
        .catalog-header h1 {
            font-size: 36px;
            margin: 10px 0;
            font-weight: normal;
            letter-spacing: 2px;
        }
        .catalog-header p { font-style: italic; color: #666; margin: 0; }

        .lookbook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .look-card {
            background: var(--card-bg);
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .look-card img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            display: block;
        }
        .look-info { padding-top: 12px; text-align: center; }
        .look-info input {
            width: 90%;
            border: none;
            border-bottom: 1px solid transparent;
            text-align: center;
            background: transparent;
            color: inherit;
            font-family: inherit;
        }
        .look-info input:focus { outline: none; border-bottom: 1px solid var(--accent); }
        .item-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .item-price { font-size: 14px; color: var(--accent); font-family: 'Arial', sans-serif; }

        /* Teme vizuale */
        .theme-dark { background: #121212; color: #f5f5f5; padding: 30px; }
        .theme-dark .look-card { background: #1e1e1e; }
        .theme-boutique { background: #f3eae8; color: #3d2c2e; padding: 30px; }
        .theme-boutique .look-card { border: 1px solid #d8c3bf; }

        @media print {
            .toolbar { display: none; }
            body { padding: 0; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <h3>Studio Lookbook</h3>
    <input type="text" id="brandInput" placeholder="Nume Brand (ex: ATELIER NOIR)" oninput="updateHeader()">
    <input type="text" id="collectionInput" placeholder="Nume Colecție (ex: Toamnă / Iarnă)" oninput="updateHeader()">
    <select id="themeSelect" onchange="changeTheme()">
        <option value="">Stil: Editorial Minimal</option>
        <option value="theme-dark">Stil: Streetwear Dark</option>
        <option value="theme-boutique">Stil: Classic Boutique</option>
    </select>
    <input type="file" id="photoInput" multiple accept="image/*" onchange="addLooks(event)">
    <button onclick="window.print()">Exportă Catalog PDF</button>
</div>

<div id="catalogContainer">
    <div class="catalog-header">
        <div class="brand-name" id="displayBrand">ATELIER VESTIMENTAR</div>
        <h1 id="displayCollection">Colecția Capsulă 2026</h1>
        <p>Catalog oficial de prezentare</p>
    </div>

    <div class="lookbook-grid" id="lookbookGrid"></div>
</div>

<script>
    function updateHeader() {
        const brand = document.getElementById('brandInput').value;
        const collection = document.getElementById('collectionInput').value;
        document.getElementById('displayBrand').innerText = brand || 'ATELIER VESTIMENTAR';
        document.getElementById('displayCollection').innerText = collection || 'Colecția Capsulă 2026';
    }

    function changeTheme() {
        document.getElementById('catalogContainer').className = document.getElementById('themeSelect').value;
    }

    function addLooks(event) {
        const grid = document.getElementById('lookbookGrid');
        const files = event.target.files;

        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const card = document.createElement('div');
                card.className = 'look-card';
                card.innerHTML = `
                    <img src="${e.target.result}" alt="Ținută colecție">
                    <div class="look-info">
                        <input type="text" class="item-title" placeholder="Denumire piesă (ex: Palton Lână)">
                        <input type="text" class="item-price" placeholder="Preț / Cod (ex: 450 MDL • #SKU01)">
                    </div>
                `;
                grid.appendChild(card);
            };
            reader.readAsDataURL(files[i]);
        }
    }
</script>

</body>
</html>
